name: sahra
description: "Sahra (working title): Arabic multiplayer party games."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sahra_client:
    path: ../../packages/sahra_client
  flutter_secure_storage: ^11.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Cut out from the designer's character sheets (design/characters).
    - assets/characters/
  fonts:
    # Cairo (SIL Open Font License, see assets/fonts/OFL.txt). Bundled so Arabic
    # renders the same on every device and works offline.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    # Baloo Bhaijaan 2 (SIL Open Font License, see assets/fonts/OFL-BalooBhaijaan2.txt):
    # rounded, playful display face for titles, buttons and game text.
    - family: Baloo
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-500.ttf
          weight: 500
        - asset: assets/fonts/BalooBhaijaan2-600.ttf
          weight: 600
        - asset: assets/fonts/BalooBhaijaan2-700.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2-800.ttf
          weight: 800
